[package]
name = "baiti-desktop"
version = "1.0.0"
description = "Baiti Atelier Desktop: Suite industrielle de chiffrage et debitage pour ateliers algeriens"
authors = ["Baiti"]
edition = "2021"

[lib]
name = "baiti_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
