<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="50%" stop-color="#050C18" />
      <stop offset="100%" stop-color="#02050A" />
    </linearGradient>

    <!-- Aluminum Profile Gradient -->
    <linearGradient id="aluProfile" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#CBD5E1" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="goldAccent" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3D4" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>

    <!-- Laser Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldAccent)" stroke-width="1.5" />

  <!-- Outer Architectural Miter Frame (forming letter 'B') -->
  <!-- Left Vertical Jamb Profile -->
  <path
    d="M 16 12 L 24 18 L 24 46 L 16 52 Z"
    fill="url(#aluProfile)"
    stroke="#02050A"
    stroke-width="0.8"
    stroke-linejoin="round"
  />

  <!-- Top Horizontal Header -->
  <path
    d="M 16 12 L 38 12 L 44 18 L 24 18 Z"
    fill="url(#aluProfile)"
    stroke="#02050A"
    stroke-width="0.8"
  />

  <!-- Upper Loop Diagonal & Vertical Return -->
  <path
    d="M 38 12 L 46 20 L 46 26 L 38 31 L 24 31 L 24 25 L 38 25 L 40 22 L 36 18 L 24 18"
    fill="url(#aluProfile)"
    stroke="#02050A"
    stroke-width="0.8"
  />

  <!-- Center Transom (Meneau / Traverse Médiane) -->
  <path
    d="M 16 32 L 24 28 L 38 28 L 41 32 L 38 36 L 24 36 Z"
    fill="url(#goldAccent)"
    stroke="#02050A"
    stroke-width="0.8"
  />

  <!-- Lower Loop Diagonal & Vertical Return -->
  <path
    d="M 38 33 L 48 39 L 48 45 L 40 52 L 16 52 L 24 46 L 38 46 L 42 42 L 38 38 L 24 38 L 24 33 Z"
    fill="url(#aluProfile)"
    stroke="#02050A"
    stroke-width="0.8"
  />

  <!-- Golden Assembly Corner Brackets (Équerres d'angle en laiton) -->
  <rect x="15" y="11" width="5" height="5" rx="1" fill="url(#goldAccent)" />
  <circle cx="17.5" cy="13.5" r="0.8" fill="#1E293B" />

  <rect x="15" y="48" width="5" height="5" rx="1" fill="url(#goldAccent)" />
  <circle cx="17.5" cy="50.5" r="0.8" fill="#1E293B" />

  <rect x="42" y="17" width="4.5" height="4.5" rx="1" fill="url(#goldAccent)" />
  <circle cx="44.2" cy="19.2" r="0.7" fill="#1E293B" />

  <rect x="44" y="42" width="4.5" height="4.5" rx="1" fill="url(#goldAccent)" />
  <circle cx="46.2" cy="44.2" r="0.7" fill="#1E293B" />

  <!-- Thermal Break Laser Guide (Cyan Line) -->
  <line x1="20" y1="16" x2="20" y2="48" stroke="#38BDF8" stroke-width="1" filter="url(#cyanGlow)" stroke-linecap="round" />
</svg>